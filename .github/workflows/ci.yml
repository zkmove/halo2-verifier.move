name: CI checks

on:
  workflow_dispatch:
    inputs:
      force_aptos_cli_install:
        description: "Skip Aptos CLI cache and force reinstall"
        required: false
        type: boolean
        default: false
      force_sui_cli_install:
        description: "Skip Sui CLI cache and force reinstall"
        required: false
        type: boolean
        default: false
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SUI_REV: 76269b3f6ff1ea56ddfcf258be8c19ffe21ce105

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    name: Tests on Ubuntu
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache Aptos CLI
        if: ${{ inputs.force_aptos_cli_install != true }}
        id: cache-aptos
        uses: actions/cache@v4
        with:
          path: ~/aptos-cli/aptos
          key: aptos-cli-v7.11.1-${{ runner.os }}-${{ runner.arch }}

      - name: Install Aptos CLI v7.11.1 (fixed version)
        if: ${{ inputs.force_aptos_cli_install == true || steps.cache-aptos.outputs.cache-hit != 'true' }}
        run: |
          mkdir -p ~/aptos-cli

          # GitHub Actions ubuntu-latest uses Ubuntu 22.04 as of 2024-06
          if [[ "${{ runner.os }}" == "Linux" && "${{ runner.arch }}" == "X64" ]]; then
            if lsb_release -rs | grep -q "^24"; then
              URL="https://github.com/zkmove/aptos-core/releases/download/aptos-cli-v7.11.1-zkmove/aptos-cli-7.11.1-Ubuntu-24.04-x86_64.zip"
            else
              URL="https://github.com/zkmove/aptos-core/releases/download/aptos-cli-v7.11.1-zkmove/aptos-cli-7.11.1-Ubuntu-22.04-x86_64.zip"
            fi
          else
            echo "Unsupported runner: ${{ runner.os }} ${{ runner.arch }}"
            exit 1
          fi

          echo "Downloading Aptos CLI from: $URL"
          curl -L "$URL" -o aptos.zip
          unzip -q aptos.zip -d ~/aptos-cli
          chmod +x ~/aptos-cli/aptos
          rm aptos.zip

      - name: Add Aptos CLI to PATH
        run: echo "$HOME/aptos-cli" >> $GITHUB_PATH

      - name: Cache Sui CLI
        if: ${{ inputs.force_sui_cli_install != true }}
        id: cache-sui
        uses: actions/cache@v4
        with:
          path: ~/sui-cli/bin/sui
          key: sui-cli-${{ env.SUI_REV }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Sui CLI
        if: ${{ inputs.force_sui_cli_install == true || steps.cache-sui.outputs.cache-hit != 'true' }}
        run: |
          cargo install \
            --git https://github.com/zkmove/sui.git \
            --rev "$SUI_REV" \
            --bin sui \
            --locked \
            --root ~/sui-cli

      - name: Add Sui CLI to PATH
        run: echo "$HOME/sui-cli/bin" >> $GITHUB_PATH

      - name: Verify Aptos CLI version
        run: aptos --version

      - name: Verify Sui CLI version
        run: sui --version

      - name: Code formatting check
        run: cargo fmt --all -- --check

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run Move tests
        run: |
                aptos move test --package-dir ./packages/common --skip-fetch-latest-git-deps --dev --experiments spec-check=off
                aptos move test --package-dir ./packages/verifier --skip-fetch-latest-git-deps --dev --experiments spec-check=off
                aptos move test --package-dir ./packages/api --skip-fetch-latest-git-deps --dev --experiments spec-check=off
                sui move test --path ./packages/api-sui

      - name: Run Rust tests
        run: cargo test --workspace --all-features
